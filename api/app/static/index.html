<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recebimento Inteligente · Cocapec</title>
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">COCAPEC · Recebimento Inteligente</p>
      <h1>Agenda de recebimentos</h1>
      <p>Agende, autorize e acompanhe cada descarga até a saída.</p>
    </div>
    <nav aria-label="Módulos"><a class="swagger" href="/app/boletim.html">Boletim diário</a> <a class="swagger" href="/painel">Painel gerencial</a> <a class="swagger" href="/docs" target="_blank" rel="noopener">Documentação da API</a></nav>
  </header>

  <main>
    <section class="panel create-panel">
      <div class="section-title">
        <div><span>01</span><h2>Novo agendamento</h2></div>
        <button id="reload" class="secondary">Atualizar dados</button>
      </div>
      <form id="schedule-form">
        <label>Fornecedor<select id="supplier" required></select></label>
        <button id="new-supplier" class="secondary" type="button">Cadastrar fornecedor</button>
        <label>Data<input id="date" type="date" required></label>
        <label>Horário<select id="time" required><option>08:00</option><option>10:00</option><option>13:00</option><option>15:00</option></select></label>
        <label>Acondicionamento<select id="packing" required><option value="PALETIZADO">Paletizado</option><option value="BIG_BAG">Big bag</option><option value="BATIDO">Batido</option></select></label>
        <label class="check"><input id="walk-in" type="checkbox"> Agendamento feito na hora</label>
        <div class="invoice-block">
          <h3>Nota fiscal</h3>
          <label>Número<input id="invoice-number" maxlength="20"></label>
          <label>Chave de acesso<input id="invoice-key" inputmode="numeric" pattern="[0-9]{44}" maxlength="44" placeholder="44 dígitos"></label>
          <label>Peso total (kg)<input id="weight" type="number" min="0" step="0.001"></label>
          <label>Arquivo XML ou PDF<input id="invoice-file" type="file" accept=".xml,.pdf,application/xml,application/pdf" required></label>
        </div>
        <button type="submit">Criar agendamento</button>
      </form>
      <p id="form-message" class="message" aria-live="polite"></p>
    </section>

    <section class="panel agenda-panel">
      <div class="section-title">
        <div><span>02</span><h2>Operação do dia</h2></div>
        <label class="compact">Data<input id="filter-date" type="date"></label>
      </div>
      <div id="slots" class="slots"></div>
      <div id="appointments" class="appointments"><p class="empty">Carregando…</p></div>
    </section>

    <section class="panel exception-panel">
      <div class="section-title"><div><span>03</span><h2>Caminhão não recebido</h2></div></div>
      <form id="refusal-form">
        <label>Fornecedor<select id="refusal-supplier"></select></label>
        <label>Data<input id="refusal-date" type="date" required></label>
        <label>Motivo<select id="refusal-reason"><option value="SEM_AGENDAMENTO_SEM_VAGA">Sem agendamento e sem vaga</option><option value="DIVERGENCIA_NF_PEDIDO">Divergência NF/pedido</option><option value="CASO_FORTUITO">Caso fortuito</option><option value="OUTRO">Outro</option></select></label>
        <label>Descrição<input id="refusal-description" maxlength="300"></label>
        <button type="submit">Registrar não recebimento</button>
      </form>
      <p id="refusal-message" class="message" aria-live="polite"></p>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="/app/app.js" defer></script>
</body>
</html>
