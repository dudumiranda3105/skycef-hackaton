spring:
  application:
    name: skycef-recebimento
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skycef}
    username: ${DB_USER:skycef}
    password: ${DB_PASSWORD:skycef}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
