server:
  port: ${PORT:8000}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skycef}
    username: ${SPRING_DATASOURCE_USERNAME:skycef}
    password: ${SPRING_DATASOURCE_PASSWORD:skycef}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  swagger-ui:
    path: /docs
app:
  auth:
    # false desliga o login (testes de integração e desenvolvimento). Em uso normal, deixe ligado.
    ativa: ${AUTH_ATIVA:true}
  # senha dos usuários iniciais, criados só na primeira subida; vazia = gera uma e mostra no log da API
  senha-inicial: ${SENHA_INICIAL:}
