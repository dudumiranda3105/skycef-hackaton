services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skycef}
      POSTGRES_USER: ${POSTGRES_USER:-skycef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skycef}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # so a propria maquina; nao expor no Wi-Fi do evento
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skycef} -d ${POSTGRES_DB:-skycef}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-skycef}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-skycef}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-skycef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AUTH_ATIVA: ${AUTH_ATIVA:-true}
      SENHA_INICIAL: ${SENHA_INICIAL:-cocapec2026}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:8000:8000"

  # web: sera adicionado quando o front for definido (ver web/README.md)

volumes:
  pgdata:
