xt x="895" y="668" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#42698d">não</text><rect x="760" y="677" width="250" height="56" rx="14" fill="#fff0ed" stroke="#507090" stroke-width="2"/><text x="885" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#233247">Não recebimento: recusa</text><line x1="1010" y1="705" x2="1038" y2="705" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="1060" cy="705" r="22" fill="#fff" stroke="#42698d" stroke-width="5"/><text x="1060" y="747" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#233247">Recusado</text><line x1="630" y1="648" x2="630" y2="772" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="500" y="772" width="290" height="56" rx="14" fill="#f1f6fa" stroke="#507090" stroke-width="2"/><text x="645" y="805" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#233247">Entrada: início da descarga</text><line x1="500" y1="800" x2="450" y2="800" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="195" y="772" width="255" height="56" rx="14" fill="#f1f6fa" stroke="#507090" stroke-width="2"/><text x="322.5" y="805" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#233247">Saída + chapas + equipamentos</text><line x1="322" y1="828" x2="322" y2="868" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="322" cy="890" r="22" fill="#fff" stroke="#42698d" stroke-width="5"/><text x="322" y="932" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#233247">Descarga concluída</text><line x1="1565" y1="183" x2="1565" y2="772" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1400" y="772" width="330" height="56" rx="14" fill="#fff4d7" stroke="#507090" stroke-width="2"/><text x="1565" y="805" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#233247">Efetivar cancelamento ou reagendar</text><line x1="1565" y1="828" x2="1565" y2="868" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="1565" cy="890" r="22" fill="#fff" stroke="#42698d" stroke-width="5"/><text x="1565" y="932" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#233247">Vaga decidida pelo armazém</text><circle cx="225" cy="1005" r="22" fill="#fff" stroke="#42698d" stroke-width="2"/><text x="225" y="1047" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#233247">Dia seguinte</text><line x1="247" y1="1005" x2="290" y2="1005" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="290" y="977" width="270" height="56" rx="14" fill="#f1f6fa" stroke="#507090" stroke-width="2"/><text x="425" y="1010" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#233247">Boletim do dia (4 armazéns)</text><line x1="560" y1="1005" x2="600" y2="1005" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="600" y="977" width="310" height="56" rx="14" fill="#f1f6fa" stroke="#507090" stroke-width="2"/><text x="755" y="1010" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#233247">Produção + equipe (completa/meia)</text><line x1="910" y1="1005" x2="960" y2="1005" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="960" y="977" width="240" height="56" rx="14" fill="#f1f6fa" stroke="#507090" stroke-width="2"/><text x="1080" y="1010" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#233247">Piso + complemento</text><line x1="1080" y1="1033" x2="1080" y2="1107" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="950" y="1107" width="270" height="56" rx="14" fill="#f1f6fa" stroke="#507090" stroke-width="2"/><text x="1085" y="1140" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#233247">Painel por período e armazém</text><line x1="1220" y1="1135" x2="1270" y2="1135" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1270" y="1107" width="290" height="56" rx="14" fill="#f1f6fa" stroke="#507090" stroke-width="2"/><text x="1415" y="1140" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#233247">Sobra/falta de chapas em R$</text><line x1="1560" y1="1135" x2="1608" y2="1135" stroke="#56708e" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="1630" cy="1135" r="22" fill="#fff" stroke="#42698d" stroke-width="5"/><text x="1630" y="1177" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#233247">Fim</text><text x="40" y="1228" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#233247">Exceções: caminhão sem agendamento entra só se houver vaga e for agendado na hora; sem vaga, Portaria ou Armazém registram não recebimento (também caso fortuito ou outro).</text><text x="40" y="1252" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#233247">Atraso: tolerância de 15 min, aviso de 16 a 29 min, perda da agenda a partir de 30 min (esclarecimento da Cocapec registrado pela equipe). Reagendamento por caso fortuito pode exceder o limite do horário.</text></svg>